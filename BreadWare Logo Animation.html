  <script>
    (function() {
      function purge(root) {
        if (!root.querySelectorAll) return;
        root.querySelectorAll('button, #__bundler_err, #__bundler_loading').forEach(el => el.remove());
        if (root.id === '__bundler_err' || root.id === '__bundler_loading' || root.tagName === 'BUTTON') root.remove();
      }
      function injectStyle(doc) {
        try {
          const style = doc.createElement('style');
          style.textContent = 'button, #__bundler_err, #__bundler_loading { display: none !important; } body, html { background: #0a0a0f !important; }';
          doc.head.appendChild(style);
        } catch(e) {}
      }
      function darkenLightBackgrounds(doc) {
        try {
          const all = doc.body ? doc.body.querySelectorAll('*') : [];
          all.forEach(el => {
            const bg = doc.defaultView.getComputedStyle(el).backgroundColor;
            const m = bg.match(/(\d+),\s*(\d+),\s*(\d+)/);
            if (m) {
              const r = +m[1], g = +m[2], b = +m[3];
              if (r > 200 && g > 200 && b > 200) {
                el.style.setProperty('background', '#0a0a0f', 'important');
                el.style.setProperty('background-color', '#0a0a0f', 'important');
              }
            }
          });
        } catch(e) {}
      }
      function watch(doc) {
        injectStyle(doc);
        darkenLightBackgrounds(doc);
        const obs = new MutationObserver(mutations => {
          mutations.forEach(m => m.addedNodes.forEach(node => purge(node)));
          darkenLightBackgrounds(doc);
        });
        obs.observe(doc.documentElement, { childList: true, subtree: true });
      }
      watch(document);

      // The bundler swaps out document.documentElement entirely once it
      // finishes unpacking, which destroys the style tag and observer above.
      // Re-arm protection on the freshly parsed document right after.
      const origReplaceWith = Element.prototype.replaceWith;
      Element.prototype.replaceWith = function(...args) {
        const wasDocEl = (this === document.documentElement);
        const result = origReplaceWith.apply(this, args);
        if (wasDocEl) setTimeout(() => watch(document), 0);
        return result;
      };
    })();
  </script>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

relative; animation:bw-glow 1.3s ease 2.05s 1;\">\n        <defs>\n          <mask id=\"bwReveal\" maskUnits=\"userSpaceOnUse\">\n            <g fill=\"none\" stroke=\"#ffffff\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n              <sc-for list=\"{{ paths }}\" as=\"p\" hint-placeholder-count=\"26\">\n                <path d=\"{{ p.d }}\" pathLength=\"100\" stroke-dasharray=\"100\" style=\"stroke-dashoffset:100; will-change:stroke-dashoffset;\"><\u002Fpath>\n              <\u002Fsc-for>\n            <\u002Fg>\n          <\u002Fmask>\n        <\u002Fdefs>\n        <image href=\"{{ imgSrc }}\" x=\"0\" y=\"0\" width=\"100\" height=\"100\" mask=\"url(#bwReveal)\"><\u002Fimage>\n      <\u002Fsvg>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-direction:column; align-items:center; gap:18px;\">\n      <div key=\"{{ wordKey }}\" style=\"font-family:'Fredoka',sans-serif; font-weight:700; font-size:40px; line-height:1; letter-spacing:-.01em; opacity:0; animation:bw-fadeup .6s ease 2.15s forwards;\">\n        <span style=\"color:#16303c;\">Bread<\u002Fspan><span style=\"color:#1FC9F1;\">Ware<\u002Fspan>\n      <\u002Fdiv>\n      <button onclick=\"{{ replay }}\" style=\"display:flex; align-items:center; gap:8px; font-family:'Fredoka',sans-serif; font-weight:500; font-size:15px; color:#5a6b73; background:#fff; border:1px solid #d4dde1; border-radius:999px; padding:9px 20px; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.04);\" style-hover=\"background:#f6f9fa; color:#16303c;\">\n        <span style=\"font-size:16px;\">↻<\u002Fspan> Replay\n      <\u002Fbutton>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:600}}\">\nclass Component extends DCLogic {\n  state = { runId: 1 };\n  componentDidMount() {\n    // Wait for the embedded logo image, then run the JS-driven draw.\n    // (CSS keyframes on <path>s inside <mask>/<defs> never get scheduled by the\n    // browser — startTime stays null — so we animate stroke-dashoffset by hand.)\n    if (typeof window !== \"undefined\" && !window.BW_LOGO_SRC) {\n      let n = 0;\n      const t = setInterval(() => {\n        if (window.BW_LOGO_SRC || n++ > 60) { clearInterval(t); this.forceUpdate(); this._startDraw(); }\n      }, 50);\n    } else {\n      this._startDraw();\n    }\n  }\n  componentDidUpdate(prev) {\n    if (prev && prev.runId !== this.state.runId) this._startDraw();\n  }\n  componentWillUnmount() { if (this._raf) cancelAnimationFrame(this._raf); }\n  _startDraw() {\n    if (this._raf) cancelAnimationFrame(this._raf);\n    const run = () => {\n      const paths = [...document.querySelectorAll(\"#bwReveal path\")];\n      const timing = this._timing || [];\n      if (!paths.length || !timing.length) { this._raf = requestAnimationFrame(run); return; }\n      const total = this._totalDur || 2.0;\n      const t0 = performance.now();\n      const tick = () => {\n        const tm = this._timing || timing;\n        const el = (performance.now() - t0) / 1000;\n        for (let i = 0; i < paths.length; i++) {\n          const t = tm[i]; if (!t) continue;\n          let pr = (el - t.delay) / t.dur;\n          pr = pr < 0 ? 0 : pr > 1 ? 1 : pr;\n          paths[i].style.strokeDashoffset = (100 * (1 - pr)).toFixed(2);\n        }\n        if (el < total + 0.08) this._raf = requestAnimationFrame(tick);\n      };\n      this._raf = requestAnimationFrame(tick);\n    };\n    run();\n  }\n  renderVals() {\n    const PL = [[[29.5,12.5],[43,9.5],[57,9.5],[70.5,12.5]],[[25.5,14],[19.5,16.5],[17,18.5]],[[74.5,14],[82,18]],[[56.5,20.5],[60.5,20.5]],[[54,23],[53.5,25.5],[54.5,27]],[[62.5,23],[62.5,26.5]],[[12,23.5],[9.5,29.5],[11,35.5]],[[87.5,23.5],[89,26.5]],[[34,24],[38,24]],[[32,26],[32,30.5]],[[40,26],[40,30.5]],[[89.5,27.5],[89.5,33.5],[88,36]],[[58,29.5],[57.5,46.5],[38.5,65.5],[38,89.5]],[[33.5,32],[36,33]],[[38.5,32],[36,33]],[[36,33],[35.5,48.5],[24,60],[14.5,60.5]],[[69.5,37.5],[74,37.5]],[[14,39],[15,40],[14,60]],[[68,39],[67,40.5],[68,44]],[[75.5,39],[76,43.5]],[[84.5,40],[84,45],[87,74.5],[87,85],[86,86.5]],[[71.5,46.5],[71.5,55.5],[55.5,71.5],[55,89.5],[80,90],[84,88.5]],[[14,61],[12.5,78]],[[12,79],[12,83],[14,87]],[[15,88],[17,89.5],[20,90],[37.5,90]],[[38.5,90],[46,90]]];\n    const TOTAL = 2.0;     // seconds for the whole draw\n    const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);\n    // Clockwise sweep from bottom-centre: 0° = straight down, increasing angle\n    // goes bottom → left → top → right.\n    const C = [50, 52];\n    const ang = (p) => ((Math.atan2(p[1] - C[1], p[0] - C[0]) * 180 / Math.PI) - 90 + 360) % 360;\n    const plen = (pl) => { let l = 0; for (let i = 1; i < pl.length; i++) l += dist(pl[i], pl[i - 1]); return l; };\n    const farAng = (pts) => {\n      let best = pts[0], bestR = -1;\n      for (const p of pts) { const r = dist(p, C); if (r > bestR) { bestR = r; best = p; } }\n      return ang(best);\n    };\n    const orientCW = (pts) => (ang(pts[pts.length - 1]) < ang(pts[0])) ? pts.slice().reverse() : pts;\n\n    // Group fragments into the bread OUTLINE plus 3 atomic circuit BRANCHES\n    // (each = its trace + node ring). A branch draws as one unbroken unit, so\n    // the sweep finishes a whole circuit before continuing clockwise.\n    const NODES = [[36, 28], [58, 24], [72, 40]];\n    const near = (p, c, r) => dist(p, c) <= r;\n    const ringNode = (pl) => NODES.findIndex(c => pl.every(p => near(p, c, 8)));\n    const traceNode = (pl) => {\n      if (ringNode(pl) >= 0 || plen(pl) < 15) return -1;\n      for (let n = 0; n < 3; n++) if (near(pl[0], NODES[n], 7) || near(pl[pl.length - 1], NODES[n], 7)) return n;\n      return -1;\n    };\n    const branches = NODES.map((_, n) => ({ node: n, trace: null, rings: [] }));\n    const outline = [];\n    PL.forEach(pl => {\n      const rn = ringNode(pl);\n      if (rn >= 0) { branches[rn].rings.push(pl); return; }\n      const tn = traceNode(pl);\n      if (tn >= 0) { branches[tn].trace = pl; return; }\n      outline.push(pl);\n    });\n\n    // Build draw units: {pieces:[polylines drawn back-to-back], key:cw-angle}\n    const units = [];\n    outline.forEach(pl => { const pts = orientCW(pl); units.push({ pieces: [pts], key: farAng(pts) }); });\n    branches.forEach(br => {\n      if (!br.trace) { br.rings.forEach(r => { const p = orientCW(r); units.push({ pieces: [p], key: farAng(p) }); }); return; }\n      const c = NODES[br.node];\n      let t = br.trace;\n      if (dist(t[0], c) < dist(t[t.length - 1], c)) t = t.slice().reverse(); // root → node\n      const rings = br.rings\n        .map(r => { const cx = r.reduce((a, p) => a + p[0], 0) / r.length, cy = r.reduce((a, p) => a + p[1], 0) / r.length; return { pts: r, ra: (Math.atan2(cy - c[1], cx - c[0]) * 180 / Math.PI + 360) % 360 }; })\n        .sort((a, b) => a.ra - b.ra).map(o => o.pts);\n      units.push({ pieces: [t, ...rings], key: ang(t[0]) });\n    });\n    units.sort((a, b) => a.key - b.key);\n\n    const ordered = [];\n    units.forEach(u => u.pieces.forEach(pts => ordered.push({ pts, len: plen(pts) })));\n    const totalLen = ordered.reduce((a, o) => a + o.len, 0) || 1;\n    // constant-speed pen: each path starts exactly when the previous finishes\n    let cum = 0;\n    const timing = [];\n    const paths = ordered.map(o => {\n      const delay = (cum / totalLen) * TOTAL;\n      const dur = Math.max(0.03, (o.len / totalLen) * TOTAL);\n      cum += o.len;\n      timing.push({ delay, dur });\n      const d = o.pts.map((p, i) => (i ? \"L\" : \"M\") + p[0] + \" \" + p[1]).join(\" \");\n      return { d, delay: delay.toFixed(3) + \"s\", dur: dur.toFixed(3) + \"s\" };\n    });\n    this._timing = timing;\n    this._totalDur = TOTAL;\n    return {\n      runId: this.state.runId,\n      wordKey: \"w\" + this.state.runId,\n      imgSrc: (typeof window !== \"undefined\" && window.BW_LOGO_SRC) || \"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+M8AAAMBAQAY3Y2wAAAAAElFTkSuQmCC\",\n      paths,\n      replay: () => this.setState(s => ({ runId: s.runId + 1 })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
